name: Check actual browser exports
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: python -m pip install reportlab==4.4.9 Pillow==13.0.0 openpyxl==3.1.5
      - run: npm test
      - run: node scripts/build.mjs
      - run: |
          for start in 0 100 200 300 400; do python scripts/large_fixture_batch.py --start "$start"; done
          python scripts/failure_fixtures.py
          python scripts/schema_fixture.py
      - run: node tests/diagnostic-browser.mjs
      - run: node tests/browser.mjs
      - run: node tests/session-ui.mjs
      - run: |
          python tests/verify_workbooks.py
          python tests/verify_large.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: test-results/
          retention-days: 14
